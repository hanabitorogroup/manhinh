<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang — Hanabi &amp; Toro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%86%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  h1, p { margin: 0; }

  :root {
    --bg: #0d0f14;
    --bg-elev-2: #171b24;
    --border-soft: #232734;
    --text: #eceef3;
    --text-muted: #9096a8;
    --accent: #ff4d6d;
    --accent-hover: #ff6b85;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-2: 0 12px 40px rgba(0, 0, 0, 0.45);
    --font-ui: "Segoe UI", "Inter", "Roboto", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  body {
    background:
      radial-gradient(circle at 20% 20%, rgba(255, 77, 109, 0.12), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255, 209, 102, 0.10), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-lg);
    padding: 34px 28px;
    box-shadow: var(--shadow-2);
    text-align: center;
  }
  .mark { font-size: 44px; margin-bottom: 14px; }
  h1 { font-size: 19px; font-weight: 800; margin-bottom: 8px; }
  .card p.desc { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 14.5px;
    transition: background .15s, filter .15s, transform .05s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; }
  @media (hover: hover) { .btn-primary:hover { background: var(--accent-hover); } }
  .btn-ghost { background: transparent; border: 1px solid var(--border-soft); color: var(--text); }
  @media (hover: hover) { .btn-ghost:hover { filter: brightness(1.15); } }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">🎆</div>
    <h1>Không tìm thấy trang</h1>
    <p class="desc">Địa chỉ này không tồn tại trên hệ thống menu điện tử Hanabi &amp; Toro.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Về trang chính</a>
      <a class="btn btn-ghost" href="/admin">Trang quản trị</a>
    </div>
  </div>
</body>
</html>
