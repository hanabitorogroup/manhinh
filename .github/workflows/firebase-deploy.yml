name: Deploy to Firebase

# Tự động deploy Firebase Hosting + Firestore rules mỗi khi có push. Không có
# bước build — repo này không dùng npm/webpack, "deploy" chỉ là publish thẳng
# thư mục public/ (xem README.md). Hướng dẫn thiết lập: docs/GITHUB-ACTIONS.md

on:
  push:
    branches:
      - main
      - claude/digital-menu-hanabi-toro-2xozaq
  workflow_dispatch: {}

# Nếu 2 lần push chồng lên nhau, lần chạy sau phải CHỜ lần trước xong (không
# hủy nửa chừng một deploy đang chạy, không chạy song song 2 deploy cùng lúc).
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Hosting + Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # CHẶN DEPLOY nếu cấu hình vẫn còn giá trị mẫu "PASTE_...". Nếu không
      # chặn ở đây, trang web thật sẽ lên mạng nhưng chạy ở CHẾ ĐỘ THỬ NGHIỆM
      # (dữ liệu mẫu trong localStorage của từng trình duyệt, không phải menu
      # thật, không đồng bộ giữa 4 màn hình) — lỗi rất khó nhận ra vì trang
      # vẫn "chạy được", chỉ là chạy sai dữ liệu.
      # ---------------------------------------------------------------------
      - name: Chặn deploy nếu còn cấu hình mẫu (PASTE_)
        run: |
          set -euo pipefail
          FAIL=0

          # Chỉ kiểm tra DÒNG GÁN GIÁ TRỊ của từng field, không kiểm tra cả
          # file: file này có sẵn comment hướng dẫn và chính dòng code phát
          # hiện DEMO_MODE (`apiKey.includes("PASTE_")`) đều chứa chuỗi
          # "PASTE_" vĩnh viễn — nếu grep cả file thì guard sẽ luôn luôn báo
          # lỗi kể cả sau khi đã điền đủ giá trị thật.
          CONFIG_FILE="public/assets/js/firebase-config.js"
          for FIELD in apiKey authDomain projectId storageBucket messagingSenderId appId; do
            LINE=$(grep -E "^[[:space:]]*${FIELD}[[:space:]]*:" "$CONFIG_FILE" || true)
            if [ -n "$LINE" ] && printf '%s' "$LINE" | grep -q "PASTE_"; then
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "::error file=${CONFIG_FILE}::CHƯA CẤU HÌNH FIREBASE: file ${CONFIG_FILE} vẫn còn ít nhất một giá trị mẫu 'PASTE_...' trong object firebaseConfig. Nếu deploy lúc này, trang thật sẽ chạy ở CHẾ ĐỘ THỬ NGHIỆM (dữ liệu mẫu, không phải menu thật) mà không có dấu hiệu báo lỗi rõ ràng nào. Hãy mở file ${CONFIG_FILE}, dán đủ 6 giá trị cấu hình Firebase Web App (xem hướng dẫn ngay trong file, hoặc DEPLOY.md), rồi commit lại."
          fi

          RC_FILE=".firebaserc"
          RC_LINE=$(grep -E '"default"[[:space:]]*:' "$RC_FILE" || true)
          if [ -n "$RC_LINE" ] && printf '%s' "$RC_LINE" | grep -q "PASTE_"; then
            FAIL=1
            echo "::error file=${RC_FILE}::CHƯA CẤU HÌNH FIREBASE: file ${RC_FILE} vẫn còn giá trị mẫu 'PASTE_YOUR_FIREBASE_PROJECT_ID'. Hãy thay bằng Project ID thật của dự án Firebase (Project settings → General → Project ID), rồi commit lại."
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::DEPLOY ĐÃ BỊ DỪNG để tránh phát hành trang web ở chế độ thử nghiệm. Sửa (các) file nêu trên rồi push lại. Xem docs/GITHUB-ACTIONS.md, mục 'Khắc phục sự cố' nếu cần trợ giúp."
            exit 1
          fi

          echo "OK: firebase-config.js và .firebaserc đã được cấu hình. Tiếp tục deploy."

      # ---------------------------------------------------------------------
      # Chọn phương thức xác thực. Ưu tiên FIREBASE_SERVICE_ACCOUNT (an toàn
      # hơn — quyền giới hạn, không gắn với tài khoản Google cá nhân nào).
      # Nếu chưa có (vd chính sách tổ chức chặn tạo service account key —
      # constraints/iam.disableServiceAccountKeyCreation), dùng FIREBASE_TOKEN
      # (token CI cá nhân, tạo bằng `firebase login:ci`) làm phương án thay
      # thế. Xem docs/GITHUB-ACTIONS.md để biết cách tạo/thu hồi từng loại.
      # ---------------------------------------------------------------------
      - name: Chọn phương thức xác thực
        id: auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
            echo "Xác thực bằng: FIREBASE_SERVICE_ACCOUNT (service account — phương án khuyến nghị)."
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Xác thực bằng: FIREBASE_TOKEN (token CI cá nhân qua 'firebase login:ci')."
            echo "::warning::Đang deploy bằng FIREBASE_TOKEN — token cá nhân mang quyền tài khoản Google của chủ quán, kém an toàn hơn service account. Đây là phương án tạm thời khi chưa tạo được service account key. Xem docs/GITHUB-ACTIONS.md, mục 'Xác thực bằng token cá nhân (firebase login:ci)'."
          else
            echo "::error::THIẾU THÔNG TIN XÁC THỰC FIREBASE: cần đặt một trong hai secret sau ở repo → Settings → Secrets and variables → Actions — 'FIREBASE_SERVICE_ACCOUNT' (service account key JSON, phương án khuyến nghị) hoặc 'FIREBASE_TOKEN' (token CI cá nhân tạo bằng 'firebase login:ci', dùng khi tổ chức chặn tạo service account key). Hiện chưa thấy secret nào trong hai secret trên. Xem hướng dẫn từng bước tại docs/GITHUB-ACTIONS.md."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Thứ tự ưu tiên xác định Project ID (dừng ở nguồn đầu tiên có giá trị):
      #   1. Secret FIREBASE_PROJECT_ID, nếu đã đặt.
      #   2. Field project_id trong secret FIREBASE_SERVICE_ACCOUNT (chỉ khi
      #      xác thực bằng service account — hành vi sẵn có).
      #   3. projects.default trong .firebaserc — MỚI: repo tự chứa sẵn giá
      #      trị này (đây chính là repo đang được deploy), nên là nguồn tự
      #      nhiên nhất, không cần thêm secret nào.
      #   4. Không nguồn nào có giá trị hợp lệ → dừng deploy với lỗi rõ ràng.
      # File .firebaserc thiếu, JSON hỏng, hoặc còn giá trị mẫu PASTE_ đều
      # được coi là "không có giá trị" (không crash, không deploy nhầm dự án).
      # ---------------------------------------------------------------------
      - name: Xác định Firebase Project ID
        id: project
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          set -euo pipefail

          RC_FILE=".firebaserc"
          RC_PROJECT_ID=""
          if [ -f "$RC_FILE" ]; then
            RC_PROJECT_ID=$(jq -re '.projects.default // empty' "$RC_FILE" 2>/dev/null || true)
          fi
          case "$RC_PROJECT_ID" in
            PASTE_*) RC_PROJECT_ID="" ;;
          esac

          if [ -n "${FIREBASE_PROJECT_ID:-}" ]; then
            PROJECT_ID="$FIREBASE_PROJECT_ID"
            echo "Nguồn Project ID: secret FIREBASE_PROJECT_ID."
          elif [ "$AUTH_MODE" = "service_account" ] && PROJECT_ID=$(echo "$FIREBASE_SERVICE_ACCOUNT" | jq -re '.project_id' 2>/dev/null) && [ -n "$PROJECT_ID" ]; then
            echo "Nguồn Project ID: field project_id trong secret FIREBASE_SERVICE_ACCOUNT."
          elif [ -n "$RC_PROJECT_ID" ]; then
            PROJECT_ID="$RC_PROJECT_ID"
            echo "Nguồn Project ID: projects.default trong .firebaserc."
          else
            echo "::error::Không xác định được Firebase Project ID: đã thử lần lượt (1) secret 'FIREBASE_PROJECT_ID', (2) field 'project_id' trong secret 'FIREBASE_SERVICE_ACCOUNT' (chỉ áp dụng khi xác thực bằng service account), (3) giá trị 'projects.default' trong file .firebaserc của repo — không nơi nào có giá trị hợp lệ. Cách sửa NHANH NHẤT (không cần thêm secret GitHub nào): mở file .firebaserc, đặt 'projects.default' thành Project ID thật (Firebase Console → Project settings → General → Project ID), rồi commit lại. Hoặc thêm secret 'FIREBASE_PROJECT_ID' ở repo → Settings → Secrets and variables → Actions. Xem docs/GITHUB-ACTIONS.md."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy tới dự án Firebase: $PROJECT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ghi thông tin xác thực service account
        if: steps.auth.outputs.mode == 'service_account'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Thiếu secret FIREBASE_SERVICE_ACCOUNT (repo → Settings → Secrets and variables → Actions). Xem docs/GITHUB-ACTIONS.md."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          if ! jq -e . "$RUNNER_TEMP/firebase-service-account.json" > /dev/null 2>&1; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT không phải JSON hợp lệ. Secret này phải là TOÀN BỘ nội dung file .json tải từ Firebase Console (Project settings → Service accounts → Generate new private key), dán nguyên văn, không thêm/bớt gì. Xem docs/GITHUB-ACTIONS.md."
            exit 1
          fi

      - name: Deploy Hosting + Firestore rules (service account)
        if: steps.auth.outputs.mode == 'service_account'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.26.0 deploy \
            --project "$PROJECT_ID" \
            --only hosting,firestore:rules \
            --non-interactive

      # Nhánh token: KHÔNG đặt GOOGLE_APPLICATION_CREDENTIALS ở đây (không có
      # file service account nào được ghi ra trong nhánh này). Token được
      # truyền thẳng qua flag --token của chính lệnh firebase, không qua biến
      # môi trường trung gian, không in ra, và không dùng `set -x` hay
      # `--debug` — cả hai đều có thể in nội dung token ra log Actions công
      # khai.
      - name: Deploy Hosting + Firestore rules (token)
        if: steps.auth.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.26.0 deploy \
            --project "$PROJECT_ID" \
            --only hosting,firestore:rules \
            --non-interactive \
            --token "$FIREBASE_TOKEN"

      - name: Dọn file thông tin xác thực
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
